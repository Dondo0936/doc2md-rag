name: corpus_truth

on:
  push:
    branches: [main]
    paths:
      - "packages/corpus-truth/**"
      - ".github/workflows/corpus-truth.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/corpus-truth/**"
      - ".github/workflows/corpus-truth.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: packages/corpus-truth

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The SDK has no runtime dependencies; install it to prove that stays true.
      - name: Install
        run: |
          pip install .
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests -v
