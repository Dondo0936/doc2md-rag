[project]
name = "doc2md-rag"
version = "2.0.0"
description = "CLI/MCP-first document knowledge base + hybrid RAG framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "docling>=2.72",
    "pymupdf4llm>=0.0.10",
    "pypandoc_binary>=1.13",
    "markitdown>=0.1.0",
    "pikepdf>=8.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "streamlit>=1.30,<2.0",
    "langchain-text-splitters>=0.2",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "anthropic>=0.40",
    "markdown>=3.5",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "typer>=0.12",
    "mcp>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
voyage = ["voyageai>=0.3.0"]
google = ["google-generativeai>=0.8.0"]
all-embeddings = ["openai>=1.0", "voyageai>=0.3.0", "google-generativeai>=0.8.0"]
ui = ["streamlit>=1.30,<2.0", "plotly>=5.18"]
dev = ["pytest", "ruff"]

[project.scripts]
doc2md-rag = "cli:main"
doc2md-rag-mcp = "mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "cli",
    "mcp_server",
    "knowledge_base",
    "converter",
    "rag_engine",
    "config",
    "claude_wrapper",
    "tracer",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
